name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          mkdir buildsrc
          unzip -q AktienScanner_Android_V4_CloudBuild.zip -d buildsrc

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android Projekt vorbereiten
        working-directory: buildsrc
        run: |
          flutter create --platforms=android .

      - name: Abhängigkeiten installieren
        working-directory: buildsrc
        run: flutter pub get

      - name: APK bauen
        working-directory: buildsrc
        run: flutter build apk --release

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AktienScanner-APK
          path: buildsrc/build/app/outputs/flutter-apk/app-release.apk
